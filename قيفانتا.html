م",blocks:[{heading:"قبول الشروط",body:["باستخدامك منصة قيفانتا فإنك توافق على هذه الشروط. قيفانتا منصة لطلب وجبات المناسبات والفعاليات من المطاعم المتاحة في المدن المعروضة على الموقع."]},{heading:"نطاق الخدمة",body:["يُختار المطعم بعد تحديد مدينة متاحة. لا يمكن إرسال طلب لمدينة غير مفعّلة، ولا اختيار مطعم قبل تحديد المدينة. موعد الاستلام يجب أن يقع ضمن وقت الوجبة التي تختارها: فطور أو غداء أو عشاء."]},{heading:"إنشاء الطلب",body:["قبل الإرسال تراجع المدينة والمطعم ونوع الوجبة والكميات وموعد المناسبة وموقع الاستلام. كمية كل صنف هي عدد الوجبات المطلوبة، ولا تُستنتج من عدد الحضور.","المبلغ الظاهر قبل رد المطعم تقديرٌ غير ملزم. لا يُعد الطلب مؤكدًا إلا بعد قبول المطعم وظهور حالة «تم تأكيد الطلب»."]},{heading:"بعد الإرسال",body:["تتابع حالة الطلب من طلباتي. إذا تعذر على المطعم القبول تظهر الحالة، ويمكنك بدء طلب جديد من مطعم آخر متاح. أي تعديل بعد الإرسال يعتمد على حالة الطلب الظاهرة لك.","يُنشأ الحساب لمتابعة الطلبات. الفاتورة النهائية، بعد التسليم، تُرسل إلى بريدك الإلكتروني الشخصي."]}]},cancel:{title:"الإلغاء والاسترجاع",blocks:[{heading:"طلب الإلغاء",body:["يجوز طلب إلغاء الطلب وهو بانتظار تأكيد المطعم، أو بعد تأكيده وقبل التسليم. يخضع الطلب للمراجعة، وإرساله لا يعني اكتمال الإلغاء حتى تتغير حالة الطلب.","لا يُقبل طلب إلغاء جديد بعد التسليم، ولا إذا تعذر على المطعم تأكيد الطلب، ولا إذا كان طلب إلغاء سابقًا قد أُرسل لنفس الطلب."]},{heading:"بعد التسليم",body:["الوجبات تُجهَّز حسب موعد المناسبة، ولذلك لا تُعامل بعد التسليم كسلعة قابلة للإرجاع. إذا وصل الطلب ناقصًا أو مخالفًا لما تم تأكيده، أبلغ عن ذلك من صفحة الإبلاغ عن مشكلة مع ذكر رقم الطلب.","لا يُحتسب مبلغ استرجاع أو مدة إرجاع عامة خارج حالة الطلب الظاهرة لك."]},{heading:"الفاتورة",body:["تُرسل الفاتورة النهائية إلى بريدك الإلكتروني الشخصي بعد التسليم. إذا تعذر تأكيد الطلب فلا تُصدر له فاتورة نهائية."]}]},contact:{title:"تواصل معنا",blocks:[{heading:"بخصوص طلب قائم",body:["للتواصل بشأن طلب أرسلته، راسلنا من البريد الإلكتروني الشخصي المسجّل في حسابك، واذكر رقم الطلب كما يظهر في طلباتي، مع وصف موجز للمسألة."]},{headi
